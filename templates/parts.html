{% extends "base.html" %}{% block body %}<h1>Spare Parts</h1><div class="card"><h2>Add Part</h2><form method="post" class="row"><input name="name" placeholder="Part name" required><input name="brand" placeholder="Brand"><input name="vehicle" placeholder="Vehicle model (e.g. Honda Activa)" required><input name="price" type="number" step="0.01" min="0" placeholder="Price ₹" required><input name="stock" type="number" min="0" placeholder="Stock" required><input name="min_stock" type="number" min="0" placeholder="Min (3)"><button>Add</button></form></div>
<div class="card"><form class="row"><input name="q" value="{{q}}" placeholder="Search part / brand / vehicle model"><button>🔍 Search</button></form><table><tr><th>Part</th><th>Brand</th><th>Fits Vehicle</th><th>Price</th><th>Stock</th><th>Restock</th></tr>
{% for p in rows %}<tr><td>{{p.name}}</td><td>{{p.brand}}</td><td>{{p.vehicle}}</td><td>₹{{ '%.0f'|format(p.price) }}</td><td>{{p.stock}} {% if p.stock<=p.min_stock %}<span class="badge warn">Low</span>{% endif %}</td><td><form method="post" action="/part/{{p.id}}/restock" class="row"><input name="qty" type="number" min="1" style="width:70px" required><button>+</button></form></td></tr>{% else %}<tr><td colspan="6">No parts found</td></tr>{% endfor %}</table></div>{% endblock %}
