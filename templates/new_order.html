{% extends "base.html" %}{% block body %}<h1>New Order</h1><div class="card"><form method="post"><div class="row"><select name="customer_id" required><option value="">— Select customer —</option>{% for c in customers %}<option value="{{c.id}}">{{c.name}} ({{c.phone}})</option>{% endfor %}</select><input name="address" placeholder="Delivery address" required style="min-width:280px"></div>
<h2 style="margin-top:12px">Parts (up to 3)</h2>{% for i in range(3) %}<div class="row"><select name="part_id"><option value="">— Select part —</option>{% for p in parts %}<option value="{{p.id}}">{{p.vehicle}} · {{p.name}} — ₹{{ '%.0f'|format(p.price) }} ({{p.stock}} left)</option>{% endfor %}</select><input name="qty" type="number" min="1" placeholder="Qty" style="width:80px"></div>{% endfor %}
<p style="color:var(--mut);font-size:13px">Delivery fee ₹40, free for orders of ₹1000 or more. A 4-digit delivery OTP is generated automatically.</p><button>Place Order</button></form></div>{% endblock %}
