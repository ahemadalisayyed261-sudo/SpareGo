{% extends "base.html" %}{% block body %}<h1>Customers</h1><div class="card"><form method="post" class="row"><input name="name" placeholder="Name / Garage" required><input name="phone" placeholder="Phone (10 digits)" pattern="[0-9]{10}" required><select name="kind"><option>Individual</option><option>Mechanic</option><option>Garage</option></select><input name="address" placeholder="Address"><button>Add</button></form></div>
<div class="card"><table><tr><th>Name</th><th>Phone</th><th>Type</th><th>Address</th><th>Orders</th></tr>{% for c in rows %}<tr><td>{{c.name}}</td><td>{{c.phone}}</td><td>{{c.kind}}</td><td>{{c.address}}</td><td>{{c.n}}</td></tr>{% endfor %}</table></div>{% endblock %}
